# Change these first
owner: upptime # Your GitHub organization or username, where this repository lives
repo: upptime # The name of this repository

sites:
  - name: Main website
    url: https://ankerd.nl
  - name: Con App
    url: https://con.ankerd.org
  - name: Con App BETA
    url: https://dev.ankerd.org
  - name: CDN
    url: https://cdn.ankerd.org
  - name: Nextcloud
    url: https://nextcloud.ankerd.org

status-website:
  # Add your custom domain name, or remove the `cname` line if you don't have a domain
  # Uncomment the `baseUrl` line if you don't have a custom domain and add your repo name there
  cname: status.ankerd.org
  # baseUrl: /your-repo-name
  logoUrl: https://media.discordapp.net/attachments/465068365472464906/1550523197965734009/ankerdmascotteankerdlogountitledcentre.png?ex=6aaea4c1&is=6aad5341&hm=0c5433e686468ef52eb293e6cc1d4dc03c2cd60a2dc6c694e0ee0e4d7fc9a1b2&=&format=webp&quality=lossless&width=1280&height=1280
  name: ankerd Status
  introTitle: "**Upptime** is the open-source uptime monitor and status page, powered entirely by GitHub."
  introMessage: This is a sample status page which uses **real-time** data from our [GitHub repository](https://github.com/upptime/upptime). No server required — just GitHub Actions, Issues, and Pages. [**Get your own for free**](https://github.com/upptime/upptime)
  navbar:
    - title: Status
      href: /
    - title: GitHub
      href: https://github.com/$OWNER/$REPO

# Upptime also supports notifications, assigning issues, and more
